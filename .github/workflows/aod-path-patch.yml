name: Patch AOD continuous path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aod-path-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add continuous draw_path support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ss = Path('android/app/src/main/java/dev/linjian/peek/ScreenshotService.java')
          s = ss.read_text(encoding='utf-8')
          if 'public boolean doPath(' not in s:
              pat = re.compile(r'(\n\s*public boolean doSwipe\(float x1, float y1, float x2, float y2, long durationMs\) \{.*?\n\s*\})', re.S)
              m = pat.search(s)
              if not m:
                  raise SystemExit('doSwipe marker missing')
              method = r'''

              public boolean doPath(String pointsJson, long durationMs) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.N) return false;
                  try {
                      JSONArray points = new JSONArray(pointsJson == null ? "[]" : pointsJson);
                      if (points.length() < 2) return false;
                      Path p = new Path();
                      int valid = 0;
                      for (int i = 0; i < points.length(); i++) {
                          JSONArray pair = points.optJSONArray(i);
                          if (pair == null || pair.length() < 2) continue;
                          double dx = pair.optDouble(0, Double.NaN);
                          double dy = pair.optDouble(1, Double.NaN);
                          if (Double.isNaN(dx) || Double.isNaN(dy)) continue;
                          float px = (float) dx;
                          float py = (float) dy;
                          if (valid == 0) p.moveTo(px, py); else p.lineTo(px, py);
                          valid++;
                      }
                      if (valid < 2) return false;
                      GestureDescription.StrokeDescription stroke = new GestureDescription.StrokeDescription(p, 0, Math.max(80, durationMs));
                      return dispatchGesture(new GestureDescription.Builder().addStroke(stroke).build(), null, null);
                  } catch (Exception e) {
                      DebugState.append(this, "连续轨迹异常：" + shortMsg(e));
                      return false;
                  }
              }
              '''
              s = s[:m.end()] + method + s[m.end():]
              ss.write_text(s, encoding='utf-8')

          cs = Path('android/app/src/main/java/dev/linjian/peek/CompanionService.java')
          c = cs.read_text(encoding='utf-8')
          if '"draw_path".equals(action)' not in c:
              needle = '} else if ("swipe".equals(action)) { ok = svc != null && svc.doSwipe(x1, y1, x2, y2, duration); result = ok ? "swipe" : "swipe_failed_or_accessibility_missing";'
              if needle not in c:
                  raise SystemExit('swipe action marker missing')
              repl = '} else if ("draw_path".equals(action)) { ok = svc != null && svc.doPath(inputText, duration); result = ok ? "draw_path" : "draw_path_failed_or_invalid_points_or_accessibility_missing";\n' + needle
              c = c.replace(needle, repl, 1)
              cs.write_text(c, encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/dev/linjian/peek/ScreenshotService.java android/app/src/main/java/dev/linjian/peek/CompanionService.java
          git diff --cached --quiet || git commit -m "Add continuous draw_path gesture support"
          git push
